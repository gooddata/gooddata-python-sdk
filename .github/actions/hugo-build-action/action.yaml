name: Hugo Build
description: Builds documentation using Hugo
inputs:
  base-url:
    required: true
    description: Base url used during build

runs:
  using: "composite"
  steps:
    - name: "Setup GO"
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '>=1.20.1'
        cache: false
    - name: "Cache Go modules"
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ hashFiles('docs/go.sum') }}
        restore-keys: go-mod-
    - name: "Setup Node"
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
    # docs/package-lock.json pins hugo-extended, so npm ci installs the hugo binary that
    # the build step runs with npx.
    - name: "Install Dependencies"
      shell: bash
      working-directory: ./docs
      run: |
        npm ci
    - name: "Cache Hugo resources"
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: docs/resources/_gen
        key: hugo-resources-${{ hashFiles('docs/go.sum', 'docs/config/**') }}
        restore-keys: hugo-resources-
    - name: "Build documentation"
      working-directory: ./docs
      env:
        BASE_URL: ${{ inputs.base-url }}
      shell: bash
      run: |
        npx --no hugo --minify ${BASE_URL:+--baseURL $BASE_URL} -e _default
