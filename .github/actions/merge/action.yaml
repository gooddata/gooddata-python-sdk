name: "gitflow-merge"
description: "Promote or backmerge (infra) gitflow repository branches"
inputs:
  cutoff:
    description: "Cutoff date for promote/backmerge (e.g., 'X days ago')"
    type: string
    default: "now"
  merge:
    description: "Merge the created PR (left open for review if false)"
    type: boolean
    default: false
  source:
    description: "Head branch to backmerge"
    type: string
    required: true
  target:
    description: "Target branch to backmerge into"
    type: string
    required: true
  token_pr:
    description: "GitHub token to use for PR creation/merge"
    type: string
    required: true
  token_push:
    description: "GitHub token to use for pull/push"
    type: string
    required: true

runs:
  using: "composite"
  steps:
    # The next step pushes the snapshot branch with these credentials.
    - name: Checkout source branch # zizmor: ignore[artipacked]
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        ref: "${{ inputs.source }}"
        token: "${{ inputs.token_push }}"
    - name: Checkout and push new branch
      run: |
        commit=$(git log --until="${INPUTS_CUTOFF}" --format="%H" -n 1)
        git checkout $commit
        short=$(git rev-parse --short HEAD)
        branch="snapshot-${INPUTS_SOURCE}-${short}-to-${INPUTS_TARGET}"
        git checkout -b $branch
        git push origin $branch
        echo "commit=${commit}" >> $GITHUB_OUTPUT
        echo "short=${short}" >> $GITHUB_OUTPUT
        echo "branch=${branch}" >> $GITHUB_OUTPUT
      shell: bash
      id: push
      env:
        INPUTS_CUTOFF: ${{ inputs.cutoff }}
        INPUTS_SOURCE: ${{ inputs.source }}
        INPUTS_TARGET: ${{ inputs.target }}
    - name: Create the promote/backmerge PR
      run: |
        gh pr create \
          --title "[bot] Merge ${INPUTS_SOURCE}/${STEPS_PUSH_OUTPUTS_SHORT} into ${INPUTS_TARGET}" \
          --body ":rocket: Automated PR to perform merge from **${INPUTS_SOURCE}** into **${INPUTS_TARGET}** with changes up to ${STEPS_PUSH_OUTPUTS_SHORT} (created by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
          --base ${INPUTS_TARGET} --head ${STEPS_PUSH_OUTPUTS_BRANCH} \
        | tee -a $GITHUB_STEP_SUMMARY
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token_pr }}
        INPUTS_SOURCE: ${{ inputs.source }}
        STEPS_PUSH_OUTPUTS_SHORT: ${{ steps.push.outputs.short }}
        INPUTS_TARGET: ${{ inputs.target }}
        STEPS_PUSH_OUTPUTS_BRANCH: ${{ steps.push.outputs.branch }}
    - name: Merge the created PR
      if: ${{ inputs.merge == 'true' }}
      run: gh pr merge --merge --admin --delete-branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token_pr }}
