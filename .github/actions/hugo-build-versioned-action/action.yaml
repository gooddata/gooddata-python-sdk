name: Hugo Versioned Build
description: Builds versioned documentation using Hugo
inputs:
  base-url:
    required: false
    description: Optional base url used during build
  working-directory:
    required: false
    description: Path to documentation directory
    default: docs
  hugo-env:
    required: false
    description: Environment variable
    default: production
  fetch-from:
    required: false
    description: repo to fetch the versions from
    default: origin

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: ".python-version"
        cache: 'pip'
        cache-dependency-path: scripts/script-requirements.txt
    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/script-requirements.txt
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '>=1.20.1'
        cache: false
    - name: "Cache Go modules"
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ hashFiles('docs/go.sum') }}
        restore-keys: go-mod-
    - name: "Setup Node"
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json
    # docs/package-lock.json pins hugo-extended, so npm ci installs the hugo binary that
    # the build step runs with npx.
    - name: "Install Dependencies"
      working-directory: ./docs
      shell: bash
      run: |
        npm ci
    - name: "Generate version docs"
      working-directory: ./docs
      shell: bash
      run: |
        rm -f generate.sh
        wget https://raw.githubusercontent.com/gooddata/gooddata-python-sdk/master/scripts/generate.sh
        chmod +x ./generate.sh
        ./generate.sh ${INPUTS_FETCH_FROM} master
      env:
        INPUTS_FETCH_FROM: ${{ inputs.fetch-from }}
    - name: "Cache Hugo resources"
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: docs/resources/_gen
        key: hugo-resources-${{ hashFiles('docs/go.sum', 'docs/config/**') }}
        restore-keys: hugo-resources-
    - name: "Build documentation"
      working-directory: ./docs
      env:
        THIS_BRANCH: ${{ inputs.this-branch }}
        BASE_URL: ${{ inputs.base-url }}
        HUGO_ENV: ${{ inputs.hugo-env }}
      shell: bash
      run: |
        npx --no -- hugo --minify ${BASE_URL:+--baseURL $BASE_URL}
