name: Back merge to rel/dev branch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  master-to-fast:
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on:
      group: infra1-runners-arc
      labels: runners-small
    steps:
      # The job does not check out the repository, so the action cannot be referenced
      # as ./.github/actions/merge. It always runs from master, the branch being merged.
      - uses: gooddata/gooddata-python-sdk/.github/actions/merge@master # zizmor: ignore[unpinned-uses]
        with:
          merge: true
          source: "master"
          target: "rel/dev"
          token_pr: ${{ secrets.TOKEN_GITHUB_YENKINS_ADMIN }}
          token_push: ${{ secrets.TOKEN_GITHUB_YENKINS_ADMIN }}
