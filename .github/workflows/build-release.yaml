# (C) 2022 GoodData Corporation
# The single workflow that publishes to PyPI -- both stable and dev releases.
#
# * Stable release: triggered by pushing a vX.Y.Z tag (see bump-version.yaml). Builds every
#   component, creates the GitHub release, publishes to PyPI and notifies #releases.
# * Dev release: triggered manually (workflow_dispatch). Bumps the checked-out branch to the
#   next N.N.N.devN version, builds and publishes to PyPI. No GitHub release, no notification.
#
# Both paths must stay in this one file. PyPI attestations record the workflow file that
# published each release, and PyPI flags a "Change of provenance" whenever it differs from
# the previous release's. With dev and stable releases in separate files, every stable
# release that followed a dev release was flagged.

name: Build Python Package and Create Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      BRANCH_NAME:
        type: string
        description: 'Branch name to dev-release from'
        default: "master"

# One release of each kind at a time. Each tag is unique, so runs never collide on the tag
# itself, but is_latest is computed once per run: with two releases in flight, the earlier
# tag can finish last and take the "Latest" badge back from the newer one. Serializing keeps
# the badge in release order. For dev releases it keeps two runs from computing the same
# devN version from PyPI. Never cancels -- a cancelled run leaves components half-published.
#
# Stable and dev runs use separate groups: a group holds only one pending run, and a newer
# pending run cancels it. In a shared group, a dev release dispatched while a tag release
# waits would cancel the tag release.
concurrency:
  group: build-release-${{ github.event_name }}
  cancel-in-progress: false

env:
  COMPONENTS: '["gooddata-api-client","gooddata-pandas","gooddata-fdw","gooddata-sdk","gooddata-dbt","gooddata-flight-server","gooddata-flexconnect","gooddata-pipelines","gooddata-eval"]'

jobs:
  matrix-components:
    name: Prepare matrix components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.export.outputs.components }}
    steps:
      - name: Export components JSON
        id: export
        run: echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"

  build:
    name: Build all components
    needs: matrix-components
    permissions:
      contents: read
    strategy:
      matrix:
        component: ${{ fromJSON(needs.matrix-components.outputs.components) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        # Tag push: the tag itself. Dev release: the requested branch.
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.BRANCH_NAME || github.ref }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        prune-cache: true
    - name: Bump to dev version
      if: github.event_name == 'workflow_dispatch'
      run: |
        uv sync --only-group release --locked
        uv run tbump --only-patch --non-interactive "$(./scripts/next_dev.sh)"
    - name: Build ${{ matrix.component }}
      run: |
          if [ "${{ matrix.component }}" = "gooddata-api-client" ]; then
            cd ${{ matrix.component }}
          else
            cd packages/${{ matrix.component }}
          fi
          uv build --out-dir dist
    - name: Persist ${{ matrix.component }} artifacts
      uses: actions/upload-artifact@v6
      with:
        name: artifacts_${{ matrix.component }}
        path: |
          ${{ matrix.component == 'gooddata-api-client' && format('{0}/dist/', matrix.component) || format('packages/{0}/dist/', matrix.component) }}
        if-no-files-found: error

  tag-checks:
    name: Check the triggering tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the checks need every tag and the default branch
      - id: check
        uses: ./.github/actions/release-tag-checks

  github_release:
    name: Create GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
      - tag-checks
    permissions:
      contents: write
    steps:
      - name: Obtain artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: ${{ github.ref_name }}
          writeToFile: false
          includeRefIssues: false
          useGitmojis: false
      - name: Create GitHub release
        uses: "softprops/action-gh-release@v2"
        with:
          body: ${{ steps.changelog.outputs.changes }}
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: false
          prerelease: false
          # False for a patch of an older line, so v1.60.1 does not take the badge from
          # v1.73.0. Only in force for tags whose tree contains this file -- see MAINTENANCE.md.
          make_latest: ${{ needs.tag-checks.outputs.is_latest }}
          files: |
            dist/**/*.whl
            dist/**/*.tar.gz
  publish:
    name: Publish components
    runs-on: ubuntu-latest
    needs:
      - matrix-components
      - build
    permissions:
      id-token: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.matrix-components.outputs.components) }}
    steps:
      - name: Obtain ${{ matrix.component }} artifacts
        uses: actions/download-artifact@v6
        with:
          name: artifacts_${{ matrix.component }}
          path: dist/${{ matrix.component }}
      - name: Push ${{ matrix.component}} to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.component }}
          verbose: true
  slack-notification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Notify to slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "#releases"
            text: "The release of *gooddata-python-sdk@${{ github.ref_name }}*, has been successful. :tada:"
