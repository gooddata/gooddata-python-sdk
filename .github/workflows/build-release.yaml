# (C) 2022 GoodData Corporation
# The single workflow that publishes to PyPI -- both stable and dev releases.
#
# * Stable release: triggered by pushing a vX.Y.Z tag (see bump-version.yaml). Builds every
#   component, creates the GitHub release, publishes to PyPI and notifies #releases.
# * Dev release: triggered manually (workflow_dispatch). Bumps the checked-out branch to the
#   next N.N.N.devN version, builds and publishes to PyPI. No GitHub release, no notification.
#
# Both paths must stay in this one file. PyPI attestations record the workflow file that
# published each release, and PyPI flags a "Change of provenance" whenever it differs from
# the previous release's. With dev and stable releases in separate files, every stable
# release that followed a dev release was flagged.

name: Build Python Package and Create Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      BRANCH_NAME:
        type: string
        description: 'Branch name to dev-release from'
        default: "master"

# One release of each kind at a time. Each tag is unique, so runs never collide on the tag
# itself, but is_latest is computed once per run: with two releases in flight, the earlier
# tag can finish last and take the "Latest" badge back from the newer one. Serializing keeps
# the badge in release order. For dev releases it keeps two runs from computing the same
# devN version from PyPI. Never cancels -- a cancelled run leaves components half-published.
#
# Stable and dev runs use separate groups: a group holds only one pending run, and a newer
# pending run cancels it. In a shared group, a dev release dispatched while a tag release
# waits would cancel the tag release.
concurrency:
  group: build-release-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

env:
  COMPONENTS: '["gooddata-api-client","gooddata-pandas","gooddata-fdw","gooddata-sdk","gooddata-dbt","gooddata-flight-server","gooddata-flexconnect","gooddata-pipelines","gooddata-eval"]'

jobs:
  matrix-components:
    name: Prepare components and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ steps.export.outputs.components }}
      # Tag push: the tag. Dev release: the branch head, resolved once so every build job
      # builds the same commit even if the branch moves mid-run.
      ref: ${{ steps.dev.outputs.sha || github.ref }}
      # Dev release only. Computed once and shared, so all components get the same version
      # and re-running a failed build job reuses it instead of picking the next devN.
      dev_version: ${{ steps.dev.outputs.version }}
    steps:
      - name: Export components JSON
        id: export
        run: echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"
      # The script runs from this workflow's revision, not from BRANCH_NAME, so dev releases
      # also work from branches that predate it. The branch only supplies the commit to build
      # and the version to start from.
      - name: Checkout the workflow revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Compute dev version
        id: dev
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH_NAME: ${{ inputs.BRANCH_NAME }}
        run: |
          git fetch --no-tags --depth=1 origin "$BRANCH_NAME"
          sha=$(git rev-parse FETCH_HEAD)
          git show "$sha:pyproject.toml" > "$RUNNER_TEMP/branch-pyproject.toml"
          # shellcheck disable=SC2046 # one argument per component
          version=$(python3 scripts/next_dev_version.py --pyproject "$RUNNER_TEMP/branch-pyproject.toml" $(jq -r '.[]' <<< "$COMPONENTS"))
          echo "Dev release $version from $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build all components
    needs: matrix-components
    permissions:
      contents: read
    strategy:
      matrix:
        component: ${{ fromJSON(needs.matrix-components.outputs.components) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ needs.matrix-components.outputs.ref }}
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        prune-cache: true
    - name: Bump to dev version
      if: github.event_name == 'workflow_dispatch'
      env:
        DEV_VERSION: ${{ needs.matrix-components.outputs.dev_version }}
      run: |
        uv sync --only-group release --locked
        uv run tbump --only-patch --non-interactive "$DEV_VERSION"
    - name: Build ${{ matrix.component }}
      run: |
          if [ "${MATRIX_COMPONENT}" = "gooddata-api-client" ]; then
            cd ${MATRIX_COMPONENT}
          else
            cd packages/${MATRIX_COMPONENT}
          fi
          uv build --out-dir dist
      env:
        MATRIX_COMPONENT: ${{ matrix.component }}
    - name: Persist ${{ matrix.component }} artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: artifacts_${{ matrix.component }}
        path: |
          ${{ matrix.component == 'gooddata-api-client' && format('{0}/dist/', matrix.component) || format('packages/{0}/dist/', matrix.component) }}
        if-no-files-found: error

  tag-checks:
    name: Check the triggering tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the checks need every tag and the default branch
          persist-credentials: false
      - id: check
        uses: ./.github/actions/release-tag-checks

  github_release:
    name: Create GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
      - tag-checks
    permissions:
      contents: write
    steps:
      - name: Obtain artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054 # v1.11.0
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: ${{ github.ref_name }}
          writeToFile: false
          includeRefIssues: false
          useGitmojis: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.changelog.outputs.changes }}
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: false
          prerelease: false
          # False for a patch of an older line, so v1.60.1 does not take the badge from
          # v1.73.0. Only in force for tags whose tree contains this file -- see MAINTENANCE.md.
          make_latest: ${{ needs.tag-checks.outputs.is_latest }}
          files: |
            dist/**/*.whl
            dist/**/*.tar.gz
  publish:
    name: Publish components
    runs-on: ubuntu-latest
    needs:
      - matrix-components
      - build
    permissions:
      id-token: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.matrix-components.outputs.components) }}
    steps:
      - name: Obtain ${{ matrix.component }} artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts_${{ matrix.component }}
          path: dist/${{ matrix.component }}
      - name: Push ${{ matrix.component}} to pypi
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/${{ matrix.component }}
          verbose: true
  slack-notification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: publish
    permissions: {}
    steps:
      - name: Notify to slack
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "#releases"
            text: "The release of *gooddata-python-sdk@${{ github.ref_name }}*, has been successful. :tada:"
