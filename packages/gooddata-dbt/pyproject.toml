# (C) 2025 GoodData Corporation
[project]
name = "gooddata-dbt"
version = "1.74.0"
description = "dbt plugin for GoodData"
readme = "README.md"
license = "MIT"
authors = [
    {name = "GoodData", email = "support@gooddata.com"}
]
requires-python = ">=3.10"
dependencies = [
    "gooddata-sdk~=1.74.0",
    "pyyaml>=6.0",
    "attrs>=21.4.0,<=26.1.0",
    "cattrs>=22.1.0,<=26.1.0",
    "requests>=2.33.0,<3.0.0",
    "tabulate>=0.8.10,<1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.scripts]
gooddata-dbt = "gooddata_dbt.dbt_plugin:main"

[dependency-groups]
test = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pytest-json-report==1.5.0",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["deep_translator", "github"]

[tool.hatch.build.targets.wheel]
packages = ["src/gooddata_dbt"]

[tool.coverage.run]
source = ["gooddata_dbt"]

[tool.coverage.paths]
source = [
    "src/gooddata_dbt",
    "**/site-packages/gooddata_dbt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
