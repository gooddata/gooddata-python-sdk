# Environment, into which data products are delivered
# ID is configured in a pipeline (Gitlab/Github) in jobs, which are then running against the configured environment
# Finally, GoodData workspace is created and populated for each data product and for each environment
environment_setups:
  - id: default
    environments:
      - id: development
        name: Development
        elt_environment: dev
        # Optional - overrides data product early_access_values in this environment
        early_access_values:
          - "<early_access_feature_id>"
      - id: staging
        name: Staging
        elt_environment: staging
      - id: production
        name: Production
        elt_environment: prod

data_products:
  - id: sales
    name: "Sales"
    environment_setup_id: default
    model_ids:
      - salesforce
    localization:
      from_language: en
      to:
        - locale: fr-FR
          language: fr
        - locale: zh-Hans
          language: "chinese (simplified)"
  - id: marketing
    name: "Marketing"
    environment_setup_id: default
    model_ids:
      - hubspot
    # Optional - early access features enabled in workspaces of this data product.
    # Omit to keep whatever is set in the workspace, use [] to disable all.
    early_access_values: []
    # If execution of an visualization fails, and you need some time to fix it
    skip_tests:
      - "<visualization_id>"

# You can deliver data products to multiple organizations. Each organization can contain different (sub)set of products
organizations:
  - gooddata_profile: local
    data_product_ids:
      - sales
  - gooddata_profile: production
    data_product_ids:
      - sales
      - marketing
