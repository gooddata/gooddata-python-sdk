<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gd-eval report</title>
<style>
  /* Tokens follow GoodData's product UI (sdk-ui-kit default theme) with the brand lime as the
     accent. Status colours come in two steps: the base for fills and bars, and a darker
     "-ink" step for text, because the base green, orange and cyan fail contrast on white.
     --dim is one step darker than the product's secondary grey (#6d7680) and the -ink steps
     are tuned so every text/background pair here clears 4.5:1, including on the tinted chip,
     hover and conversation backgrounds, where the product values fall just short. */
  :root {
    --lime: #dafe85; --on-lime: #09090c;
    --bg: #f5f8fa; --panel: #fff; --ink: #464e56; --ink-strong: #000; --dim: #5f6872;
    --line: #dde4eb; --thead: #f7f8fa; --hover: rgba(109, 118, 128, .1); --track: #ebeff4;
    --primary: #14b2e2; --primary-ink: #0c6884; --primary-tint: #e8f7fc;
    --pass: #00c18d; --pass-ink: #00704f; --pass-bg: rgba(0, 193, 141, .15);
    --warn: #f18600; --warn-ink: #7d5a2e; --warn-bg: rgba(241, 134, 0, .15);
    --fail: #e54d42; --fail-ink: #aa2117; --fail-bg: rgba(229, 77, 66, .15);
    --shadow: rgba(20, 56, 93, .15);
    --font: "Avenir Next", Avenir, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  header {
    display: flex; align-items: center; gap: 14px; height: 47px; padding: 0 20px;
    background: #000; color: #fff; border-bottom: 3px solid var(--lime);
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .01em; }
  header .divider { width: 1px; height: 20px; background: rgba(255, 255, 255, .3); }
  h1 { margin: 0; font-size: 14px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--dim); font-size: 12px; }
  header .sub { margin-left: auto; color: rgba(255, 255, 255, .72); white-space: nowrap; }
  .badge {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 3px;
    background: var(--lime); color: var(--on-lime); font-size: 11px; font-weight: 700;
  }
  main { display: flex; align-items: flex-start; gap: 0; }
  #left { flex: 1 1 auto; min-width: 0; padding: 18px 22px 60px; }
  #drawer {
    flex: 0 0 44%; max-width: 44%; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    border-left: 1px solid var(--line); background: var(--panel); padding: 16px 20px 60px; display: none;
    box-shadow: -2px 0 8px var(--shadow);
  }
  #drawer.open { display: block; }
  section { margin-bottom: 20px; }
  h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; }
  /* Many run columns make the item table wider than the pane; it scrolls inside its own
     box so the page itself never scrolls sideways (which would push the drawer off). */
  .tablewrap { overflow: auto; max-height: 78vh; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); background: var(--thead); }
  #items thead th { position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; box-shadow: inset 0 -1px 0 var(--line); }
  #items tbody tr { cursor: pointer; }
  #items tbody tr:hover { background: var(--hover); }
  #items tbody tr.sel { background: var(--primary-tint); }
  #items tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; }
  .q { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Status chip: text in the readable "-ink" step on the base colour at 15% alpha. The word
     itself carries the meaning, so colour is never the only signal. */
  .st {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-weight: 700; font-size: 11px;
    letter-spacing: .03em; white-space: nowrap;
  }
  .st.pass { background: var(--pass-bg); color: var(--pass-ink); }
  .st.fail { background: var(--fail-bg); color: var(--fail-ink); }
  .st.skip, .st.err { background: var(--warn-bg); color: var(--warn-ink); }
  .st.none { padding: 0; color: var(--dim); font-weight: 400; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--pass); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; min-width: 0; }
  .card > b { display: block; font-size: 13px; font-weight: 700; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .big { font-size: 26px; font-weight: 700; color: var(--ink-strong); font-variant-numeric: tabular-nums; margin: 2px 0; }
  .card .sub2, .sub2 { font-size: 12px; color: var(--dim); }
  /* Latency tables: one row per run, one table per population. The strip marks where the
     percentiles fall between the fastest and slowest sample (band = P50..P90); positions come
     from the figures in the report, nothing is computed here beyond the scale. */
  .lat-table .strip { position: relative; width: 150px; height: 18px; }
  .strip::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; background: var(--track); border-radius: 2px; }
  .strip .band { position: absolute; top: 7px; height: 4px; background: var(--primary); opacity: .45; border-radius: 2px; }
  .strip .tick { position: absolute; top: 3px; width: 2px; height: 12px; margin-left: -1px; background: var(--dim); border-radius: 1px; }
  .strip .tick.t50 { top: 0; height: 18px; background: var(--primary-ink); }
  .blurb { font-size: 12px; color: var(--dim); margin: 0 0 10px; max-width: 100ch; }
  .tablewrap.flat { max-height: none; margin-bottom: 4px; }
  h3.cap { margin: 14px 0 6px; }
  #latency h2:not(:first-child) { margin-top: 26px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; }
  #filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  input, select, button {
    font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--panel); color: inherit;
  }
  #q { flex: 1 1 200px; min-width: 140px; }
  #expr { flex: 2 1 320px; min-width: 200px; font-family: var(--mono); font-size: 12px; }
  #expr.bad { border-color: var(--fail); background: var(--fail-bg); }
  .hint { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-bottom: 8px; }
  .count { font-size: 12px; color: var(--dim); margin-left: auto; }
  .kv { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 12px; font-size: 12.5px; }
  .kv > div { padding: 3px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .kv .k { grid-column: 1 / -1; font-weight: 700; border: 0; padding-top: 8px; }
  pre {
    margin: 4px 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto;
  }
  .tl { font-size: 12px; }
  .tl .row { display: grid; grid-template-columns: 15ch 1fr 7ch; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; }
  .tl .row:hover { background: var(--hover); }
  .tl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl .track { background: var(--track); border-radius: 3px; height: 12px; }
  .tl .track > i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
  .tl .row.reasoning .track > i { background: var(--dim); opacity: .55; }
  .tl .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .turn { margin: 0 0 8px; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 3px 3px 0; }
  .turn.assistant { border-left-color: var(--primary); background: var(--primary-tint); }
  .turn.simulated_user { border-left-color: var(--warn); background: var(--warn-bg); }
  .turn.note { border-left-color: var(--warn); background: var(--warn-bg); font-style: italic; }
  .turn .who { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); font-weight: 700; }
  .turn .said { font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; background: var(--track); color: var(--ink); margin-right: 4px; }
  .chip.y { background: var(--pass-bg); color: var(--pass-ink); } .chip.n { background: var(--fail-bg); color: var(--fail-ink); }
  .close { float: right; cursor: pointer; color: var(--dim); background: none; border: 0; font-size: 18px; line-height: 1; }
  .empty { color: var(--dim); padding: 20px 0; }
  #drawer section { margin-top: 16px; }
</style>
</head>
<body>
<script id="data" type="application/json">__GD_EVAL_DATA__</script>

<header>
  <span class="brand">gd-eval</span>
  <span class="divider"></span>
  <h1 id="title"></h1>
  <div class="sub" id="meta"></div>
</header>

<main>
  <div id="left">
    <section id="summary"></section>
    <section id="comparison"></section>
    <section id="latency"></section>
    <section>
      <h2>Items</h2>
      <div id="filters">
        <input id="q" placeholder="Search id or question…" aria-label="Search id or question">
        <select id="kind" aria-label="Filter by kind"></select>
        <select id="mode" aria-label="Filter by mode">
          <option value="">any mode</option>
          <option value="single_shot">single-shot</option>
          <option value="multi_turn">multi-turn</option>
        </select>
        <select id="status" aria-label="Filter by status">
          <option value="all">any status</option>
          <option value="fail">failed</option>
          <option value="pass">passed</option>
          <option value="err">errored</option>
          <option value="skip">skipped</option>
        </select>
        <select id="focus" title="Run the drawer and the expression filter read" aria-label="Focused run"></select>
        <input id="expr" placeholder="expression, e.g. d.filter_ranking_score === false" aria-label="Filter expression">
        <span class="count" id="count"></span>
      </div>
      <div class="hint">
        expression vars: <b>d</b> detail of focused run · <b>it</b> focused run's item · <b>i</b> row (i.per[label]) · <b>q</b> question · <b>kind</b>
      </div>
      <div class="tablewrap"><table id="items"><thead></thead><tbody></tbody></table></div>
      <div class="empty" id="noitems" hidden>Nothing matches these filters.</div>
    </section>
  </div>
  <div id="drawer"></div>
</main>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LABELS = Object.keys(DATA.runs);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 2) => (typeof v === 'number' ? v.toFixed(d) : '–');
const pct = (v) => (typeof v === 'number' ? (v * 100).toFixed(1) + '%' : '–');
// Seconds, two decimals under 10s and one above, so a 117.8s tail and a 0.84s median both read.
const secs = (v) => (typeof v === 'number' ? v.toFixed(v < 10 ? 2 : 1) + 's' : '–');

// ---------- rows: one per item id, holding that id's result in every run ----------
const rows = [];
const byId = new Map();
for (const label of LABELS) {
  for (const [id, item] of Object.entries(DATA.runs[label].items || {})) {
    let r = byId.get(id);
    if (!r) {
      r = { id, kind: item.test_kind || '', mode: item.mode || '', dataset: item.dataset_name || '', question: item.question || '', per: {} };
      byId.set(id, r);
      rows.push(r);
    }
    r.per[label] = item;
    if (!r.question) r.question = item.question || '';
    if (!r.kind) r.kind = item.test_kind || '';
    if (!r.mode) r.mode = item.mode || '';
  }
}
const statusOf = (item) => !item ? 'none' : item.skipped ? 'skip' : item.error ? 'err' : item.pass_at_k ? 'pass' : 'fail';
const LBL = { pass: 'PASS', fail: 'FAIL', err: 'ERR', skip: 'SKIP', none: '–' };
const chipHtml = (s) => `<span class="st ${s}">${LBL[s]}</span>`;

// ---------- header ----------
// The wordmark already says gd-eval, so the default title would only repeat it.
$('#title').textContent = !DATA.title || DATA.title === 'gd-eval report' ? 'Evaluation report' : DATA.title;
$('#meta').innerHTML = `${rows.length} item(s) · ${LABELS.length} run(s) · generated ${esc(DATA.generated_at)}` +
  (DATA.redacted ? '<span class="badge">REDACTED</span>' : '');

// ---------- mode split: read from the report, never recomputed here ----------
// gd-eval writes the pass counts and latency distributions per mode when it writes the JSON, so this page
// cannot disagree with the console or the JSON. A report from an older gd-eval has none and says so.
const MODES = [['single_shot', 'Single-shot'], ['multi_turn', 'Multi-turn']];
const MODE_NAME = { single_shot: 'single-shot', multi_turn: 'multi-turn' };
function modeOf(label, mode) {
  const c = DATA.comparison[label] || {};
  const s = DATA.runs[label].summary || {};
  return ((c.by_mode || s.by_mode || {})[mode]) || null;
}
const hasModes = LABELS.some((l) => (DATA.comparison[l] || {}).by_mode || (DATA.runs[l].summary || {}).by_mode);

// ---------- summary cards ----------
$('#summary').innerHTML = '<h2>Runs</h2><div class="cards">' + LABELS.map((label) => {
  const s = DATA.runs[label].summary || {};
  const rate = s.total ? s.passed / s.total : 0;
  const split = MODES.map(([m]) => [m, modeOf(label, m)]).filter(([, x]) => x && x.total)
    .map(([m, x]) => `${MODE_NAME[m]} ${x.passed}/${x.total}`);
  const trace = (modeOf(label, 'single_shot') || {}).traces_s;
  return `<div class="card"><b title="${esc(label)}">${esc(label)}</b>
    <div class="big">${pct(rate)}</div>
    <div class="sub2">${s.passed ?? 0}/${s.total ?? 0} passed · ${s.errored ?? 0} err · ${s.skipped ?? 0} skip</div>
    ${split.length ? `<div class="sub2">${split.join(' · ')} passed</div>` : ''}
    <div class="bar"><i style="width:${(rate * 100).toFixed(1)}%"></i></div>
    ${trace ? `<div class="sub2" style="margin-top:8px">single-shot per trace · P50 ${secs(trace.p50)} · P90 ${secs(trace.p90)} · P99 ${secs(trace.p99)}</div>` : ''}</div>`;
}).join('') + '</div>';

// ---------- comparison ----------
if (LABELS.length > 1) {
  const cols = [
    ['Run', (l) => esc(l), ''],
    ['Pass rate', (l) => pct(cmp(l).pass_rate), 'num'],
    ['Passed', (l) => `${cmp(l).passed ?? 0}/${cmp(l).total ?? 0}`, 'num'],
    ['Avg quality', (l) => pct(cmp(l).avg_quality_score), 'num'],
    ['Avg latency / run', (l) => num(cmp(l).avg_latency_s) + 's', 'num'],
    ['Total latency', (l) => num(cmp(l).total_latency_s, 1) + 's', 'num'],
  ];
  // Wrapped like the item table: with several runs it is wider than a narrow window, and it
  // must scroll inside its own box rather than clip.
  $('#comparison').innerHTML = '<h2>Comparison</h2><div class="tablewrap"><table><thead><tr>' +
    cols.map(([h, , c]) => `<th class="${c}">${h}</th>`).join('') + '</tr></thead><tbody>' +
    LABELS.map((l) => '<tr>' + cols.map(([, f, c]) => `<td class="${c}">${f(l)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

// ---------- latency by mode ----------
// Per trace is the main figure. gen-ai opens one trace per chat message, so a single-shot run is exactly one
// trace and its latency is that trace's response time. A multi-turn conversation spans several traces, so it
// is shown both ways: per trace (each turn, comparable with single-shot) and per full run (the whole
// conversation, simulated-user replies and judge included).
function stripHtml(st) {
  const span = st.max - st.min;
  const at = (v) => (span > 0 ? ((v - st.min) / span) * 100 : 50);
  const ticks = [['50', st.p50], ['70', st.p70], ['90', st.p90], ['99', st.p99]];
  return `<div class="strip" role="img" aria-label="Latency from ${secs(st.min)} to ${secs(st.max)}: ` +
    ticks.map(([k, v]) => `P${k} ${secs(v)}`).join(', ') + `">
      <i class="band" style="left:${at(st.p50).toFixed(1)}%;width:${(at(st.p90) - at(st.p50)).toFixed(1)}%"></i>` +
    ticks.map(([k, v]) => `<i class="tick t${k}" style="left:${at(v).toFixed(1)}%" title="P${k} ${secs(v)}"></i>`).join('') + '</div>';
}
function latencyTable({ mode, field, sample, counts }) {
  const heads = ['Run'].concat(counts ? ['Items', 'Passed'] : [])
    .concat([sample, 'Avg', 'P50 (median)', 'P70', 'P90', 'P99', 'Max', 'Range']);
  const dash = '<td class="num">–</td>';
  const rows = LABELS.map((l) => {
    const m = modeOf(l, mode);
    const st = m ? m[field] : null;
    const lead = counts
      ? (m && m.total ? `<td class="num">${m.total}</td><td class="num">${m.passed}/${m.total} (${pct(m.passed / m.total)})</td>` : `<td class="num">0</td>${dash}`)
      : '';
    const stats = st
      ? [st.n, secs(st.mean), secs(st.p50), secs(st.p70), secs(st.p90), secs(st.p99), secs(st.max)]
          .map((v) => `<td class="num">${v}</td>`).join('') + `<td>${stripHtml(st)}</td>`
      : dash.repeat(7) + '<td></td>';
    return `<tr><td>${esc(l)}</td>${lead}${stats}</tr>`;
  }).join('');
  const small = LABELS.some((l) => { const m = modeOf(l, mode); return m && m[field] && m[field].n < 100; });
  const unit = sample.toLowerCase();
  return `<div class="tablewrap flat"><table class="lat-table"><thead><tr>` +
    heads.map((h, i) => `<th class="${i > 0 && h !== 'Range' ? 'num' : ''}">${h}</th>`).join('') + `</tr></thead><tbody>${rows}</tbody></table></div>` +
    (small ? `<div class="note">With fewer than 100 ${unit}, P99 is effectively the slowest one.</div>` : '');
}
function modeSection(mode, title, blurb, tables) {
  if (!LABELS.some((l) => (modeOf(l, mode) || {}).total)) return '';
  return `<h2>${title}</h2><p class="blurb">${blurb}</p>` +
    tables.map(([caption, spec]) => (caption ? `<h3 class="cap">${caption}</h3>` : '') + latencyTable({ mode, ...spec })).join('');
}
$('#latency').innerHTML = !hasModes
  ? '<h2>Latency</h2><p class="blurb">This report was written before gd-eval split latency into single-shot and multi-turn. Re-run to get per-trace percentiles.</p>'
  : modeSection('single_shot', 'Single-shot · latency per trace',
      'One chat turn per run, so each run is exactly one trace. Latency is that trace\'s response time, from sending the message to the end of its stream; the judge, the simulated user and conversation set-up are not in it.',
      [['', { field: 'traces_s', sample: 'Traces', counts: true }]]) +
    modeSection('multi_turn', 'Multi-turn · conversations',
      'A conversation spans several traces, so it is shown both ways: per trace (each chat turn, comparable with single-shot) and per full run (the whole conversation, with simulated-user replies and the judge).',
      [['Per trace · each chat turn', { field: 'traces_s', sample: 'Traces', counts: true }],
       ['Per full run · whole conversation', { field: 'runs_s', sample: 'Runs', counts: false }]]);
function cmp(label) {
  const c = DATA.comparison[label];
  if (c) return c;
  const s = DATA.runs[label].summary || {};
  return { passed: s.passed, total: s.total, pass_rate: s.total ? s.passed / s.total : 0, avg_latency_s: s.avg_latency_s, total_latency_s: s.latency_s };
}

// ---------- filters ----------
const kinds = [...new Set(rows.map((r) => r.kind))].filter(Boolean).sort();
$('#kind').innerHTML = '<option value="">any kind</option>' + kinds.map((k) => `<option>${esc(k)}</option>`).join('');
$('#focus').innerHTML = LABELS.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
let focus = LABELS[0];
let sortKey = 'id', sortDir = 1, selected = null;

function exprFn() {
  const src = $('#expr').value.trim();
  if (!src) { $('#expr').classList.remove('bad'); return null; }
  try {
    // Local file, own data, no untrusted input -- a real expression beats a fixed set of
    // facet checkboxes over a `detail` shape that differs per test_kind.
    const f = new Function('d', 'it', 'i', 'q', 'kind', 'return (' + src + ');');
    $('#expr').classList.remove('bad');
    return f;
  } catch (e) {
    $('#expr').classList.add('bad');
    return null;
  }
}

function visible() {
  const text = $('#q').value.trim().toLowerCase();
  const kind = $('#kind').value, mode = $('#mode').value, status = $('#status').value, fn = exprFn();
  let bad = false;
  const out = rows.filter((r) => {
    const it = r.per[focus];
    if (kind && r.kind !== kind) return false;
    if (mode && r.mode !== mode) return false;
    if (status !== 'all' && statusOf(it) !== status) return false;
    if (text && !(r.id + ' ' + r.question).toLowerCase().includes(text)) return false;
    if (fn) {
      try { if (!fn(it && it.detail || {}, it || {}, r, r.question, r.kind)) return false; }
      catch (e) { bad = true; return false; }
    }
    return true;
  });
  if (bad) $('#expr').classList.add('bad');
  const key = sortKey;
  out.sort((a, b) => {
    const va = sortVal(a, key), vb = sortVal(b, key);
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
  return out;
}
function sortVal(r, key) {
  if (key === 'id' || key === 'kind' || key === 'mode' || key === 'question') return r[key] || '';
  if (key === 'latency') return (r.per[focus] || {}).avg_latency_s ?? -1;
  return LBL[statusOf(r.per[key])] || '';  // a run column
}

function render() {
  const list = visible();
  $('#count').textContent = `${list.length} of ${rows.length}`;
  const heads = [['id', 'Item'], ['kind', 'Kind'], ['mode', 'Mode'], ['question', 'Question']]
    .concat(LABELS.map((l) => [l, l]))
    .concat([['latency', 'Latency']]);
  $('#items thead').innerHTML = '<tr>' + heads.map(([k, h]) =>
    `<th data-k="${esc(k)}" tabindex="0" class="${k === 'latency' ? 'num' : ''}">${esc(h)}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  $('#items tbody').innerHTML = list.map((r) => {
    const it = r.per[focus] || {};
    return `<tr data-id="${esc(r.id)}" tabindex="0" class="${selected === r.id ? 'sel' : ''}">
      <td class="id">${esc(r.id)}</td>
      <td class="id">${esc(r.kind)}</td>
      <td>${r.mode ? `<span class="chip">${esc(MODE_NAME[r.mode] || r.mode)}</span>` : ''}</td>
      <td class="q" title="${esc(r.question)}">${esc(r.question)}</td>` +
      LABELS.map((l) => `<td>${chipHtml(statusOf(r.per[l]))}</td>`).join('') +
      `<td class="num">${num(it.avg_latency_s)}s</td></tr>`;
  }).join('');
  $('#noitems').hidden = list.length > 0;
}

function sortBy(k) {
  sortDir = sortKey === k ? -sortDir : 1;
  sortKey = k;
  render();
}
function openRow(id) {
  selected = id; render(); openDrawer(byId.get(id));
}
$('#items thead').addEventListener('click', (e) => {
  const k = e.target.closest('th')?.dataset.k;
  if (k) sortBy(k);
});
$('#items thead').addEventListener('keydown', (e) => {
  const k = e.target.closest('th')?.dataset.k;
  if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sortBy(k); }
});
$('#items tbody').addEventListener('click', (e) => {
  const id = e.target.closest('tr')?.dataset.id;
  if (id) openRow(id);
});
$('#items tbody').addEventListener('keydown', (e) => {
  const id = e.target.closest('tr')?.dataset.id;
  if (id && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openRow(id); }
});
for (const id of ['#q', '#expr', '#kind', '#mode', '#status']) $(id).addEventListener('input', render);
$('#focus').addEventListener('change', () => {
  focus = $('#focus').value;
  render();
  if (selected) openDrawer(byId.get(selected));
});

// ---------- drawer ----------
function openDrawer(r) {
  if (!r) return;
  const it = r.per[focus];
  const d = $('#drawer');
  d.classList.add('open');
  if (!it) { d.innerHTML = `<button class="close" aria-label="Close">×</button><h2>${esc(r.id)}</h2><p class="empty">Not present in ${esc(focus)}.</p>`; return; }
  const st = statusOf(it);
  d.innerHTML = `<button class="close" aria-label="Close">×</button>
    <h2>${esc(focus)}</h2>
    <div style="font-family:var(--mono);font-size:12px">${esc(r.id)}</div>
    <p style="margin:6px 0 10px">${esc(r.question)}</p>
    <div>${chipHtml(st)}
      <span class="chip">${esc(r.kind)}</span>
      <span class="chip">${it.runs ?? 0} run(s)</span>
      <span class="chip">${num(it.best_run_latency_s ?? it.avg_latency_s)}s</span>
      ${it.classification ? `<span class="chip">${esc(it.classification)}</span>` : ''}
    </div>
    ${it.error ? `<section><h2>Error</h2><pre>${esc(it.error)}</pre></section>` : ''}
    ${transcriptHtml(it)}
    ${detailHtml(it.detail || {})}
    ${timelineHtml(it)}
    ${reasoningHtml(it)}
    ${idsHtml(it)}`;
  d.querySelector('.close').onclick = () => { d.classList.remove('open'); selected = null; render(); };
  d.querySelectorAll('.tl .row').forEach((el) => {
    el.onclick = () => {
      const box = $('#tl-detail');
      box.innerHTML = el.dataset.text
        ? `<pre>${esc(el.dataset.text)}</pre>`
        : `<div class="sub">${esc(el.dataset.note || 'No expanded record for this step.')}</div>`;
    };
  });
}

// The agentic path drives a real multi-turn exchange: an answer without a visualization
// gets a simulated-user follow-up. Reading who said what is how you tell "the agent got
// there" apart from "the simulated user handed it the answer" -- so the turns are laid
// out as a conversation, with the simulated user visibly marked as not a real person.
function transcriptHtml(it) {
  const turns = (it.detail || {}).transcript || [];
  if (!turns.length) return '';
  const n = (it.detail || {}).turns;
  return `<section><h2>Conversation${n ? ` (${n} turn${n > 1 ? 's' : ''})` : ''}</h2>` +
    turns.map((t) => `<div class="turn ${esc(t.role)}">
      <div class="who">${esc(ROLE[t.role] || t.role)}${t.turn ? ` · turn ${esc(t.turn)}` : ''}</div>
      <div class="said">${esc(t.text || '')}</div>
      ${t.visualization ? `<pre>${esc(fmt(t.visualization))}</pre>` : ''}
    </div>`).join('') + '</section>';
}
const ROLE = { user: 'question', assistant: 'agent', simulated_user: 'simulated user', note: 'note' };

function detailHtml(detail) {
  // transcript/turns get their own section above; latency_breakdown and tool_calls drive
  // the timeline, where a tool step expands to the args and result it joins to.
  const skip = new Set(['latency_breakdown', 'tool_calls', 'transcript', 'turns']);
  const keys = Object.keys(detail).filter((k) => !skip.has(k));
  if (!keys.length) return '';
  const done = new Set(), parts = [];
  for (const k of keys) {
    if (!k.startsWith('expected_')) continue;
    const actual = 'actual_' + k.slice(9);
    if (!(actual in detail)) continue;
    done.add(k); done.add(actual);
    parts.push(`<div class="k">${esc(k.slice(9))}</div>
      <div><div class="sub">expected</div><pre>${esc(fmt(detail[k]))}</pre></div>
      <div><div class="sub">actual</div><pre>${esc(fmt(detail[actual]))}</pre></div>`);
  }
  const flags = keys.filter((k) => !done.has(k) && typeof detail[k] === 'boolean');
  const rest = keys.filter((k) => !done.has(k) && typeof detail[k] !== 'boolean');
  return '<section><h2>Checks</h2>' +
    (flags.length ? '<div style="margin-bottom:8px">' + flags.map((k) =>
      `<span class="chip ${detail[k] ? 'y' : 'n'}">${detail[k] ? '✓' : '✗'} ${esc(k)}</span>`).join(' ') + '</div>' : '') +
    (parts.length ? `<div class="kv">${parts.join('')}</div>` : '') +
    rest.map((k) => `<div class="sub" style="margin-top:6px">${esc(k)}</div><pre>${esc(fmt(detail[k]))}</pre>`).join('') +
    '</section>';
}
// Some values are already JSON *text* by design, not by accident: normalized_filters
// stores each filter as the canonical string equality is tested on, and tool arguments
// arrive as a serialized blob. Stringifying those again gives a wall of \" escapes, so
// they are reparsed for DISPLAY only -- `d` in the expression filter still sees the raw
// string, because that string is what the score was actually computed from.
function unwrapJson(v) {
  if (typeof v === 'string') {
    const t = v.trim();
    if (t.startsWith('{') || t.startsWith('[')) {
      try { return unwrapJson(JSON.parse(t)); } catch (e) { return v; }
    }
    return v;
  }
  if (Array.isArray(v)) return v.map(unwrapJson);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) out[k] = unwrapJson(v[k]);
    return out;
  }
  return v;
}
function fmt(v) {
  const u = unwrapJson(v);
  return typeof u === 'string' ? u : JSON.stringify(u, null, 1);
}

function timelineHtml(it) {
  const tl = (it.detail || {}).latency_breakdown || [];
  if (!tl.length) return '';
  const max = Math.max(...tl.map((s) => s.duration_s || 0)) || 1;
  const sum = tl.reduce((a, s) => a + (s.duration_s || 0), 0);
  const total = it.best_run_latency_s;
  const gap = typeof total === 'number' ? total - sum : null;
  // `index` joins a step back to its full record -- into `reasoning` for a reasoning step,
  // into `detail.tool_calls` for a tool call. The breakdown itself only carries the name,
  // so this lookup is what turns "create_visualization took 18s" into what it was asked
  // for and what it returned.
  const calls = (it.detail || {}).tool_calls || [];
  const byIndex = {};
  for (const c of calls) byIndex[c.index] = c;
  // A step with nothing to show has three quite different causes, and "no record" alone
  // sends you looking for a bug in the report instead of at the run that produced it.
  const noToolCalls = calls.length === 0;
  const rows = tl.map((s) => {
    let text = '', note = '';
    if (s.kind === 'reasoning') {
      text = (s.index != null && (it.reasoning || [])[s.index]) || '';
      if (!text) {
        note = s.index == null
          ? 'Time before the first reasoning step — nothing had been emitted yet.'
          : 'No reasoning paragraph was recorded for this step.';
      }
    } else if (byIndex[s.index]) {
      const c = byIndex[s.index];
      text = `${c.name}\n\nARGUMENTS\n${fmt(c.arguments)}\n\nRESULT\n${c.result == null ? '(none)' : c.result}`;
    } else {
      note = noToolCalls
        ? 'This run predates tool-call capture: it recorded the timeline but not what each ' +
          'call was given. Re-run the eval to get arguments and results — re-rendering an ' +
          'existing JSON report cannot add them.'
        : 'This call arrived without an index, so nothing can be joined to it.';
    }
    return `<div class="row ${esc(s.kind)}" data-text="${esc(text)}" data-note="${esc(note)}">
      <div class="nm" title="${esc(s.name)}">${esc(s.name)}</div>
      <div class="track"><i style="width:${((s.duration_s || 0) / max * 100).toFixed(1)}%"></i></div>
      <div class="d">${num(s.duration_s)}s</div></div>`;
  }).join('');
  return `<section><h2>Latency timeline</h2><div class="tl">${rows}</div>
    <div class="sub" style="margin-top:6px">${tl.length} step(s), ${num(sum)}s accounted` +
    (gap != null ? ` of ${num(total)}s (${num(gap)}s setup/teardown)` : '') +
    `</div><div id="tl-detail"></div></section>`;
}

function reasoningHtml(it) {
  const rs = it.reasoning || [];
  if (!rs.length) return '';
  return '<section><h2>Reasoning</h2>' + rs.map((t, n) =>
    `<div class="sub">#${n}</div><pre>${esc(t)}</pre>`).join('') + '</section>';
}

function idsHtml(it) {
  if (!it.conversation_id && !it.response_id) return '';
  return `<section><h2>Ids</h2><div class="id">conversation ${esc(it.conversation_id || '–')}<br>response ${esc(it.response_id || '–')}</div></section>`;
}

render();
</script>
</body>
</html>
