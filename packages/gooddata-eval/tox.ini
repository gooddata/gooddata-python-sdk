[tox]
envlist = py3{11,12,13,14,15}

[testenv]
runner = uv-venv-lock-runner
package = wheel
extras =
    llm-judge
dependency_groups =
    test
setenv =
    COVERAGE_CORE=sysmon
commands =
    pytest -v --cov --cov-report=xml tests {posargs} --json-report --json-report-file=.json-report-{envname}.json
